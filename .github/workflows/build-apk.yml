name: Build Velora APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install and prepare web files
        run: |
          npm ci || npm install
          npm run prepare-www
          npx cap add android
      - name: Add Velora native code (widget)
        run: |
          D=android/app/src/main/java/app/velora/assistant
          R=android/app/src/main/res
          mkdir -p $R/layout $R/drawable $R/xml $R/values
          cat > $D/MainActivity.java <<'VEOF'
          package app.velora.assistant;
          import android.content.Intent;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(WidgetBridgePlugin.class);
              super.onCreate(savedInstanceState);
              handleQuickAdd(getIntent());
            }
            @Override
            public void onNewIntent(Intent intent) {
              super.onNewIntent(intent);
              setIntent(intent);
              handleQuickAdd(intent);
            }
            private void handleQuickAdd(Intent intent) {
              if (intent == null) return;
              String a = intent.getStringExtra("velora_action");
              if ("quickadd".equals(a)) {
                getIntent().putExtra("velora_action", "consumed");
                bridge.eval("window.dispatchEvent(new Event('velora-quickadd'))", null);
              }
            }
          }
          VEOF
          cat > $D/WidgetBridgePlugin.java <<'VEOF'
          package app.velora.assistant;
          import android.content.Context;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          @CapacitorPlugin(name = "WidgetBridge")
          public class WidgetBridgePlugin extends Plugin {
            @PluginMethod
            public void update(PluginCall call) {
              Context c = getContext();
              c.getSharedPreferences("velora", Context.MODE_PRIVATE).edit()
                .putString("text", call.getString("text", ""))
                .putString("count", call.getString("count", "")).apply();
              VeloraWidget.refreshAll(c);
              call.resolve();
            }
          }
          VEOF
          cat > $D/VeloraWidget.java <<'VEOF'
          package app.velora.assistant;
          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.widget.RemoteViews;
          public class VeloraWidget extends AppWidgetProvider {
            @Override
            public void onUpdate(Context ctx, AppWidgetManager mgr, int[] ids) {
              for (int id : ids) mgr.updateAppWidget(id, build(ctx));
            }
            static RemoteViews build(Context ctx) {
              SharedPreferences p = ctx.getSharedPreferences("velora", Context.MODE_PRIVATE);
              RemoteViews v = new RemoteViews(ctx.getPackageName(), R.layout.velora_widget);
              v.setTextViewText(R.id.w_count, p.getString("count", "Open Velora"));
              v.setTextViewText(R.id.w_text, p.getString("text", "Open Velora once to load your tasks."));
              Intent open = ctx.getPackageManager().getLaunchIntentForPackage(ctx.getPackageName());
              PendingIntent pi = PendingIntent.getActivity(ctx, 0, open, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              v.setOnClickPendingIntent(R.id.w_root, pi);
              Intent add = ctx.getPackageManager().getLaunchIntentForPackage(ctx.getPackageName());
              if (add != null) { add.setAction("app.velora.assistant.QUICK_ADD"); add.putExtra("velora_action", "quickadd"); }
              PendingIntent addPi = PendingIntent.getActivity(ctx, 7, add, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              v.setOnClickPendingIntent(R.id.w_add, addPi);
              return v;
            }
            static void refreshAll(Context ctx) {
              AppWidgetManager m = AppWidgetManager.getInstance(ctx);
              int[] ids = m.getAppWidgetIds(new ComponentName(ctx, VeloraWidget.class));
              for (int id : ids) m.updateAppWidget(id, build(ctx));
            }
          }
          VEOF
          cat > $R/layout/velora_widget.xml <<'VEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/w_root"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="14dp"
              android:background="@drawable/widget_bg">
            <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                android:text="VELORA" android:textColor="#E3C27C" android:textStyle="bold" android:textSize="12sp"/>
            <TextView android:id="@+id/w_count" android:layout_width="match_parent" android:layout_height="wrap_content"
                android:textColor="#FFFFFF" android:textStyle="bold" android:textSize="18sp" android:maxLines="1"/>
            <TextView android:id="@+id/w_text" android:layout_width="match_parent" android:layout_height="wrap_content"
                android:layout_marginTop="6dp" android:textColor="#EFEAF8" android:textSize="14sp" android:maxLines="5"/>
            <Button android:id="@+id/w_add" android:layout_width="wrap_content" android:layout_height="wrap_content"
                android:layout_marginTop="10dp" android:text="+ Add task" android:textColor="#1A1626"
                android:background="@drawable/widget_btn"/>
          </LinearLayout>
          VEOF
          cat > $R/drawable/widget_bg.xml <<'VEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
            <solid android:color="#1A1626"/>
            <corners android:radius="22dp"/>
          </shape>
          VEOF
          cat > $R/drawable/widget_btn.xml <<'VEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
            <solid android:color="#E3C27C"/>
            <corners android:radius="99dp"/>
            <padding android:left="16dp" android:right="16dp" android:top="10dp" android:bottom="10dp"/>
          </shape>
          VEOF
          cat > $R/xml/velora_widget_info.xml <<'VEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="250dp" android:minHeight="110dp"
              android:updatePeriodMillis="1800000"
              android:initialLayout="@layout/velora_widget"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen"
              android:description="@string/velora_widget_desc"/>
          VEOF
          cat > $R/values/velora_strings.xml <<'VEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><string name="velora_widget_desc">Your top tasks at a glance</string></resources>
          VEOF
          cat > patch_manifest.py <<'VEOF'
          import re
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          perms = (
            '<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n'
            '<uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n'
            '<uses-permission android:name="android.permission.RECORD_AUDIO"/>\n')
          recv = ('<receiver android:name=".VeloraWidget" android:exported="true">'
            '<intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE"/></intent-filter>'
            '<meta-data android:name="android.appwidget.provider" android:resource="@xml/velora_widget_info"/>'
            '</receiver>\n')
          s = s.replace("<application", perms + "<application", 1).replace("</application>", recv + "</application>", 1)
          open(p, "w").write(s)
          print("manifest patched")
          VEOF
          python3 patch_manifest.py
      - name: Sync and build
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: velora-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk